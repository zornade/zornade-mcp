# Netlify configuration for mcp.zornade.com
# Reverse proxy in front of the Supabase Edge Function `mcp` (MCP server).
#
# Public surface:
#   https://mcp.zornade.com/mcp     -> MCP streamable HTTP endpoint
#   https://mcp.zornade.com/        -> static landing page (public/index.html)
#
# Backend (do not expose in docs):
#   https://wupqwfqjfpwrapgnogjv.supabase.co/functions/v1/mcp/...

[build]
  publish = "public"
  # No build step: this site only serves a static landing page + redirect rules.
  command = ""

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Reverse proxy: clean public URL -> Supabase Edge Function
# ---------------------------------------------------------------------------
# `force = true` is required so the rule wins over the default static handler
# even if a file with the same path were ever published under /public.
# `status = 200` makes this a rewrite (URL bar stays on mcp.zornade.com).
# The root `/` stays on the static landing page.
[[redirects]]
  from = "/mcp"
  to = "https://wupqwfqjfpwrapgnogjv.supabase.co/functions/v1/mcp/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "https://wupqwfqjfpwrapgnogjv.supabase.co/functions/v1/mcp/mcp/:splat"
  status = 200
  force = true

# RFC 9728 ammette anche la variante con il path del resource in coda
# (/.well-known/oauth-protected-resource/mcp). Noi pubblichiamo solo il file
# "puro" e indichiamo quello nell'header WWW-Authenticate, che e' la via che i
# client devono seguire; questa rewrite serve solo ai client che provano a
# costruirsi l'URL da soli. Su filesystem non si possono avere insieme un file
# e una directory con lo stesso nome, quindi si risolve con una rewrite.
[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.well-known/oauth-protected-resource"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# Il documento di protected resource OAuth (RFC 9728) e' un file senza
# estensione: Netlify lo servirebbe come application/octet-stream e alcuni
# client MCP rifiutano di interpretarlo. Va servito come JSON.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"

# Note: headers declared here apply to responses Netlify itself serves
# (the static landing page). For proxied responses, upstream headers
# (CORS, ...) are preserved as returned by Supabase.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
